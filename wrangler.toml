name = "blabla-trainee"
main = "worker/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "blabla-trainee.junowren.com", custom_domain = true }
]

# Static frontend build output, served for any request that isn't /api/*
[assets]
directory = "./dist"
binding = "ASSETS"

# Create with: npx wrangler d1 create pte_trainee
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "pte_trainee"
database_id = "e61014ed-e849-4c2f-b42a-a653cc430002"

# Azure Neural TTS audio cache. Create with:
# npx wrangler r2 bucket create pte-trainee-tts-cache
[[r2_buckets]]
binding = "TTS_CACHE"
bucket_name = "pte-trainee-tts-cache"

# Azure Speech resource region, from its "密钥和终结点" page (e.g. "eastus").
# The API key itself is NOT stored here for security -- it's set separately
# as a secret with: npx wrangler secret put AZURE_TTS_KEY
[vars]
AZURE_TTS_REGION = "eastus"
